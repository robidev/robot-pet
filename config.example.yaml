# petd configuration. Copy to config.yaml (picked up automatically) and edit.
# Every key is optional; defaults live in petd/config.py.
# Override any key from the environment: PETD__FACE__HOST=192.168.101.41

pet:
  name: GLaDOS

network:
  pc_ip: auto              # where the face streams audio; auto = route towards the face

vacuum:
  host: 192.168.101.43     # Valetudo; also the Player (6665) and speaker (6000) host
  poll_interval_s: 2.0

player:
  port: 6665

face:
  host: 192.168.101.40
  audio_port: 5000
  audio_gain: null         # e.g. 1.5; null leaves the device setting alone
  enable_recognition: true
  faces_lost_debounce_s: 3.0   # recognition drops out for >1.5 s with a face in view

stt:
  binary: stt/udp-stream/whisper-udp-stream
  cwd: stt/udp-stream
  model: models/ggml-base.en.bin
  vad_model: models/ggml-silero-v6.2.0.bin
  threads: 8
  extra_args: []           # e.g. ["--vad-threshold", "0.4", "--min-silence-ms", "600"]
  max_no_speech_prob: 0.6

speaker:
  sink: robot              # robot | null
  robot_port: 6000         # on the robot: socat -u TCP-LISTEN:6000,reuseaddr,fork EXEC:'aplay -f S16_LE -r 22050 -c 1 -t raw -'
  piper_url: http://127.0.0.1:5001
  manage_piper: true       # start piper-tts's http_server if nothing listens on piper_url
  volume: 1.0              # gain applied to the PCM before it is sent (0.3 is a comfortable room level)
  lead_s: 0.3
  playback_latency_s: 0.3
  gate_tail_s: 0.6

brain:
  backend: claude_cli          # claude_cli | ollama
  model: claude-haiku-4-5-20251001   # or claude-sonnet-5 for more depth, slower
  memory_dir: memory           # persona.md / backstory.md / body.md / style.md
  episode_idle_timeout_s: 600  # quiet for this long -> start a fresh conversation
  # ollama_url: http://127.0.0.1:11434
  # ollama_model: qwen2.5:7b

memory:
  db_path: runtime/pet.db      # people, sightings, conversations, facts
  greet_every_h: 4             # greet a known person by name at most this often
  stranger_every_min: 30       # mention an unrecognized face at most this often
  familiarity_thresholds: [[1, 1], [10, 3], [40, 10]]   # [interactions, days seen] per tier
  journal_in_prompt: 5         # recent conversation summaries in each new episode

api:
  host: 127.0.0.1
  port: 8765
