# petd configuration. Copy to config.yaml (picked up automatically) and edit.
# Every key is optional; defaults live in petd/config.py.
# Override any key from the environment: PETD__FACE__HOST=192.168.101.41

pet:
  name: GLaDOS

network:
  pc_ip: auto              # where the face streams audio; auto = route towards the face

vacuum:
  host: 192.168.101.43     # Valetudo; also the Player (6665) and speaker (6000) host
  poll_interval_s: 2.0

player:
  port: 6665

face:
  host: 192.168.101.40
  audio_port: 5000
  audio_gain: null         # e.g. 1.5; null leaves the device setting alone
  faces_lost_debounce_s: 5.0   # detection drops out for seconds with a face in view

stt:
  binary: stt/udp-stream/whisper-udp-stream
  cwd: stt/udp-stream
  model: models/ggml-base.en.bin
  vad_model: models/ggml-silero-v6.2.0.bin
  threads: 8
  extra_args: []           # e.g. ["--vad-threshold", "0.4", "--min-silence-ms", "600"]
  max_no_speech_prob: 0.6

speaker:
  sink: robot              # robot | null
  robot_port: 6000         # on the robot: socat -u TCP-LISTEN:6000,reuseaddr,fork EXEC:'aplay -f S16_LE -r 22050 -c 1 -t raw -'
  stop_port: 6001          # on the robot: socat -u TCP-LISTEN:6001,reuseaddr,fork EXEC:'killall aplay' (null if absent)
  piper_url: http://127.0.0.1:5001
  manage_piper: true       # start piper-tts's http_server if nothing listens on piper_url
  volume: 1.0              # gain applied to the PCM before it is sent (0.3 is a comfortable room level)
  lead_s: 2.0                  # jitter buffer: the robot's WiFi stalls for >1 s now and then
  playback_latency_s: 0.3
  gate_tail_s: 1.0             # scripts/echo_timing.py: latency + tail >= 1.3 s on this robot

brain:
  backend: claude_cli          # claude_cli | ollama
  model: claude-haiku-4-5-20251001   # or claude-sonnet-5 for more depth, slower
  memory_dir: memory           # persona.md / backstory.md / body.md / style.md
  episode_idle_timeout_s: 600  # quiet for this long -> start a fresh conversation
  # ollama_url: http://127.0.0.1:11434
  # ollama_model: qwen2.5:7b

memory:
  db_path: runtime/pet.db      # people, sightings, conversations, facts
  greet_every_h: 4             # greet a known person by name at most this often
  stranger_every_min: 30       # mention an unrecognized face at most this often
  familiarity_thresholds: [[1, 1], [10, 3], [40, 10]]   # [interactions, days seen] per tier
  journal_in_prompt: 5         # recent conversation summaries in each new episode

recognition:                   # face recognition on the PC (PLAN.md 4.7); models: scripts/fetch_face_models.py
  enabled: true
  min_face_px: 45              # ~2.5 m at VGA
  unknown_sim: 0.35            # below: unknown (E6a: the other person scored at most 0.29)
  accept_sim: 0.45             # a visit's vote needs this weighted mean to name someone
  margin: 0.15                 # over the second-best person
  min_agree: 2                 # agreeing attempts before a name
  attempt_every_s: 1.5
  max_attempts: 12
  recheck_every_s: 10          # while a named face is in view, look again this often (0: never)
  grow_sim: 0.55               # confident attempts become more fingerprints...
  max_per_person: 30           # ...up to this many per person
  enroll_samples: 5            # crops close up, then as many a step back

api:
  host: 127.0.0.1
  port: 8765

log:
  enabled: true
  dir: runtime/logs            # a folder per run: petd.log (DEBUG) and run.yaml (the config); latest -> newest
  keep_runs: 30                # older run folders are deleted
  max_old_runs_mb: 120         # ...and the older runs together at most this big (oldest go first)
  file_level: DEBUG            # the console keeps --log-level
  max_file_mb: 20              # petd.log rotates at this size,
  keep_files: 3                # keeping this many older ones
  events: true                 # every bus event to events.jsonl, for scripts/latency.py
